name: Quality — Playwright responsive & local data
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static structure and syntax
        run: |
          node --check app.js
          node --check config.js
          node --check tests/browser.cjs
          node tests/static.cjs
      - name: Install Playwright, reuse Chrome if available
        run: |
          npm install --prefix /tmp/project-qa --no-save --package-lock=false playwright@1.56.1
          if command -v google-chrome >/dev/null 2>&1; then
            echo "BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            /tmp/project-qa/node_modules/.bin/playwright install --with-deps chromium
          fi
      - name: Browser QA five viewports
        run: NODE_PATH=/tmp/project-qa/node_modules node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
